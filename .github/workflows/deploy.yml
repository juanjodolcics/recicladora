name: CI/CD Azure

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  id-token: write           # necesario para OIDC
  contents: read

env:
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/recicladora

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # MySQL temporal para que los tests de Spring puedan arrancar
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: appdb
          MYSQL_USER: app
          MYSQL_PASSWORD: app123
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Migrar la BD de pruebas
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/db/migration:/flyway/sql \
            redgate/flyway:11 \
            -url="jdbc:mysql://localhost:3306/appdb?allowPublicKeyRetrieval=true" \
            -user=app -password=app123 -connectRetries=10 migrate

      - name: Compilar y ejecutar tests
        run: ./gradlew clean build

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login en ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Construir y subir imagen
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Abrir firewall de MySQL para este runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az mysql flexible-server firewall-rule create \
            --resource-group ${{ vars.RG }} --name ${{ vars.MYSQL_NAME }} \
            --rule-name gh-runner-${{ github.run_id }} \
            --start-ip-address $IP --end-ip-address $IP

      - name: Leer credenciales de migración desde Key Vault
        run: |
          U=$(az keyvault secret show --vault-name ${{ vars.KV_NAME }} --name migrator-user --query value -o tsv)
          P=$(az keyvault secret show --vault-name ${{ vars.KV_NAME }} --name migrator-password --query value -o tsv)
          echo "::add-mask::$P"
          echo "FLYWAY_USER=$U" >> $GITHUB_ENV
          echo "FLYWAY_PASSWORD=$P" >> $GITHUB_ENV

      - name: Migrar la BD de producción
        env:
          FLYWAY_URL: jdbc:mysql://${{ vars.MYSQL_NAME }}.mysql.database.azure.com:3306/appdb?useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3
        run: |
          docker run --rm \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v ${{ github.workspace }}/db/migration:/flyway/sql \
            redgate/flyway:11 -connectRetries=5 migrate

      - name: Cerrar firewall
        if: always()
        run: |
          az mysql flexible-server firewall-rule delete \
            --resource-group ${{ vars.RG }} --name ${{ vars.MYSQL_NAME }} \
            --rule-name gh-runner-${{ github.run_id }} --yes

      - name: Desplegar en Container Apps
        run: |
          az containerapp update \
            --name ${{ vars.APP_NAME }} \
            --resource-group ${{ vars.RG }} \
            --image $IMAGE:${{ github.sha }}

      - name: Verificar salud
        run: |
          FQDN=$(az containerapp show -n ${{ vars.APP_NAME }} -g ${{ vars.RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 10 --retry-delay 10 --retry-all-errors \
            https://$FQDN/actuator/health