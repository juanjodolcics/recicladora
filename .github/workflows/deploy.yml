name: CI/CD Azure

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  id-token: write           # necesario para OIDC
  contents: read

env:
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/recicladora

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # MySQL temporal para que los tests de Spring puedan arrancar
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: appdb
          MYSQL_USER: app
          MYSQL_PASSWORD: app123
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar y ejecutar tests
        run: ./gradlew clean build

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login en ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Construir y subir imagen
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Desplegar en Container Apps
        run: |
          az containerapp update \
            --name ${{ vars.APP_NAME }} \
            --resource-group ${{ vars.RG }} \
            --image $IMAGE:${{ github.sha }}

      - name: Verificar salud
        run: |
          FQDN=$(az containerapp show -n ${{ vars.APP_NAME }} -g ${{ vars.RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 10 --retry-delay 10 --retry-all-errors \
            https://$FQDN/actuator/health